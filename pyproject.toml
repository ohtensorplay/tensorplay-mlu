[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorplay-mlu"
version = "0.1.0"
description = "Cambricon MLU device backend for TensorPlay"
requires-python = ">=3.10"
dependencies = ["tensorplay"]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The suite needs the runner. The toolkit, the card, and the SDK legs skip
# themselves when absent, so no vendor package belongs in this extra.
[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/ohtensorplay/tensorplay-mlu"
Repository = "https://github.com/ohtensorplay/tensorplay-mlu"
TensorPlay = "https://github.com/lexing-2026/TensorPlay"
Documentation = "https://github.com/lexing-2026/TensorPlay/blob/main/docs/source/notes/backends.md"

# `import tensorplay` loads the backend when the Neuware toolkit is present.
[project.entry-points."tensorplay.backends"]
mlu = "tensorplay_mlu:_autoload"

# The CNCL collective backend becomes available by name once the toolkit is
# present: tensorplay.distributed.init_process_group("cncl").
[project.entry-points."tensorplay.distributed.backends"]
cncl = "tensorplay_mlu.distributed:register"

# The MagicMind graph backend becomes available by name once the MagicMind
# SDK is installed: tensorplay.compile(model, backend="magicmind").
[project.entry-points."tensorplay_compiler_backends"]
magicmind = "tensorplay_mlu.compiler.backend:backend"

[tool.setuptools]
packages = ["tensorplay_mlu", "tensorplay_mlu.compiler"]

[tool.setuptools.package-data]
# The native sources ship with the package and are compiled against the
# installed toolkit on first load.
tensorplay_mlu = ["csrc/*.cpp", "csrc/*.h"]
